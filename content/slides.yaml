# Presenter deck. Slide types: title, markdown, join, board, conclusion.
- type: title
  title: The Startup Journey Begins
  subtitle: An experiment with AI as your co-founder
- type: markdown
  title: Can AI help you to start a business or NGO?
  body: |
    - We already use AI every day
    - It 'knows' a lot
    - It makes mistakes (what is a mistake, though?)
    - It can do stuff (e.g. do research)
    - Do you trust its advice?
- type: markdown
  title: Let's start an experiment
  body: |
    1. Form a group, join via QR code
    2. Pick a topic for your fictional startup
    3. Go from station to station and make decisions (25 min.)
    4. Finally, present your idea on stage (2 min. each)
- type: markdown
  title: Developing your startup idea
  body: |
    - Everybody can do it
    - Deciding under uncertainty is tough
    - Some decisions are obviously wrong (traps!)
    - Do you trust the options given by AI?
- type: join
  title: Step 1 - Found your startup
  wifi:
    ssid: CIC
- type: board
  title: Where is everybody?
- type: conclusion
  title: What did we learn?
